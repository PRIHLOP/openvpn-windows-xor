name: Populate dependencies

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_FEATURE_FLAGS: dependencygraph

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Bootstrap vcpkg
      working-directory: src/vcpkg
      run: ./bootstrap-vcpkg.sh
    - name: vcpkg version
      working-directory: src/vcpkg
      run: ./vcpkg version
    - name: Run vcpkg (openvpn)
      working-directory: src/openvpn/contrib/vcpkg-manifests/windows/
      run: ${{ github.workspace }}/src/vcpkg/vcpkg install --debug --overlay-triplets ${{ github.workspace }}/src/openvpn/contrib/vcpkg-triplets --overlay-ports ${{ github.workspace }}/windows-msi/vcpkg-ports --overlay-ports ${{ github.workspace }}/src/openvpn/contrib/vcpkg-ports --dry-run

  openvpn-gui:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Bootstrap vcpkg
      working-directory: src/vcpkg
      run: ./bootstrap-vcpkg.sh
    - name: vcpkg version
      working-directory: src/vcpkg
      run: ./vcpkg version
    - name: Run vcpkg (openvpn-gui)
      working-directory: src/openvpn-gui
      run: ${{ github.workspace }}/src/vcpkg/vcpkg install --debug --overlay-ports ${{ github.workspace }}/windows-msi/vcpkg-ports --dry-run
